<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>EZE OS</Name>
    <Username>EzE</Username>
    <Title>EZE OS Playbook</Title>
    <ShortDescription>Optimized Windows for Students and Office Users</ShortDescription>
    <Description>EZE OS transforms your Windows into a clean, fast, private, and productivity-ready system. Designed for students, professionals, and office workers.

The installation process removes telemetry, bloatware and unnecessary services, then installs your chosen productivity software.</Description>
    <Details>A lightweight, stable, and privacy-respecting Windows experience built for learning and working, not tracking.</Details>
    <Version>1.0</Version>
    <UniqueId>866d4605-f011-4536-8f24-88a60d42e362</UniqueId>
    <Overhaul>true</Overhaul>
    <UpgradableFrom>any</UpgradableFrom>
    <EstimatedMinutes>20</EstimatedMinutes>
    <SupportedBuilds>
        <string>19044</string>
        <string>19045</string>
        <string>22621</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>Internet</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <UseKernelDriver>false</UseKernelDriver>
    <ProductCode>607</ProductCode>
    <ProgressText>EZE OS is being applied to your system. Removing bloatware, disabling telemetry, configuring privacy settings, and installing your chosen software. Please keep your PC plugged in and do not restart.</ProgressText>
    <SupportsISO>true</SupportsISO>
    <ISO>
        <DisableBitLocker>true</DisableBitLocker>
        <DisableHardwareRequirements>true</DisableHardwareRequirements>
    </ISO>
    <OOBE>
        <BulletPoints>
            <BulletPoint Icon="Rocket" Title="Built for Productivity" Description="Faster boot times, smoother performance and no background distractions - optimized for studying and office work."/>
            <BulletPoint Icon="Privacy" Title="Privacy First" Description="All Microsoft telemetry, tracking, and spyware is removed. Your data stays yours."/>
            <BulletPoint Icon="Lock" Title="Clean and Stable" Description="No bloatware, no ads, no junk. A clean Windows that just works on day one and every day after."/>
        </BulletPoints>
        <Internet>Request</Internet>
    </OOBE>
    <Software>
        <Package Option="browser-brave" DefaultWebBrowser="true">
            <Name>brave</Name>
            <Title>Brave Browser</Title>
            <Description>Fast, private browser that blocks ads and trackers by default. Great for research and studying.</Description>
            <Icon>brave.png</Icon>
        </Package>
        <Package Option="browser-firefox" DefaultWebBrowser="true">
            <Name>firefox</Name>
            <Title>Firefox</Title>
            <Description>Open-source browser with strong privacy features and full extension support.</Description>
            <Icon>firefox.png</Icon>
        </Package>
        <Package Option="browser-librewolf" DefaultWebBrowser="true">
            <Name>librewolf</Name>
            <Title>LibreWolf</Title>
            <Description>Privacy-hardened Firefox fork with no telemetry and uBlock Origin pre-installed.</Description>
            <Icon>librewolf.png</Icon>
        </Package>
        <Package Option="office-libreoffice">
            <Name>libreoffice</Name>
            <Title>LibreOffice</Title>
            <Description>Complete free office suite. Fully compatible with .docx, .xlsx, .pptx files.</Description>
            <Icon>libreoffice.png</Icon>
        </Package>
        <Package Option="office-onlyoffice">
            <Name>onlyoffice</Name>
            <Title>OnlyOffice Desktop</Title>
            <Description>Modern office suite with excellent MS Office compatibility. Ideal for students and office use.</Description>
            <Icon>onlyoffice.png</Icon>
        </Package>
        <Package Option="email-thunderbird">
            <Name>thunderbird</Name>
            <Title>Thunderbird</Title>
            <Description>Free open-source email client supporting IMAP, POP3, calendar and tasks.</Description>
            <Icon>thunderbird.png</Icon>
        </Package>
        <Package Option="media-vlc">
            <Name>vlc</Name>
            <Title>VLC Media Player</Title>
            <Description>Plays all video and audio formats. Essential for watching lectures and tutorials.</Description>
            <Icon>vlc.png</Icon>
        </Package>
        <Package Option="tools-7zip">
            <Name>7zip</Name>
            <Title>7-Zip</Title>
            <Description>Open-source archive tool for ZIP, RAR, 7z files.</Description>
            <Icon>7zip.png</Icon>
        </Package>
        <Package Option="tools-notepadpp">
            <Name>notepadplusplus</Name>
            <Title>Notepad++</Title>
            <Description>Powerful text and code editor. Great for students in IT and programming courses.</Description>
            <Icon>notepadplusplus.png</Icon>
        </Package>
    </Software>
    <FeaturePages>
        <RadioImagePage CheckDefaultBrowser="true" DependsOn="software" DefaultOption="browser-brave" IsRequired="true"
            Description="Choose your preferred web browser. All options respect your privacy.">
            <TopLine Text="Brave is recommended for students and professionals."/>
            <Options>
                <RadioImageOption None="true"/>
                <RadioImageOption>
                    <Text>Brave (Recommended)</Text>
                    <Name>browser-brave</Name>
                    <FileName>brave</FileName>
                    <GradientTopColor>#392DD1</GradientTopColor>
                    <GradientBottomColor>#A91B78</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Firefox</Text>
                    <Name>browser-firefox</Name>
                    <FileName>firefox</FileName>
                    <GradientTopColor>#FF3647</GradientTopColor>
                    <GradientBottomColor>#FFC742</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>LibreWolf</Text>
                    <Name>browser-librewolf</Name>
                    <FileName>librewolf</FileName>
                    <GradientTopColor>#057DB6</GradientTopColor>
                    <GradientBottomColor>#86D8FF</GradientBottomColor>
                </RadioImageOption>
            </Options>
            <BottomLine Text="All browsers block ads and trackers — no Google telemetry."/>
        </RadioImagePage>
        <RadioImagePage DefaultOption="office-libreoffice" IsRequired="true"
            Description="Choose your preferred office suite for documents, spreadsheets and presentations.">
            <TopLine Text="All options support Microsoft Office file formats (.docx, .xlsx, .pptx)"/>
            <Options>
                <RadioImageOption None="true"/>
                <RadioImageOption>
                    <Text>LibreOffice</Text>
                    <Name>office-libreoffice</Name>
                    <FileName>libreoffice</FileName>
                    <GradientTopColor>#1a6b3a</GradientTopColor>
                    <GradientBottomColor>#84b994</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>OnlyOffice</Text>
                    <Name>office-onlyoffice</Name>
                    <FileName>onlyoffice</FileName>
                    <GradientTopColor>#5a4a8a</GradientTopColor>
                    <GradientBottomColor>#ebc2b5</GradientBottomColor>
                </RadioImageOption>
            </Options>
            <BottomLine Text="You can install Microsoft Office manually after setup if needed."/>
        </RadioImagePage>
        <RadioPage DefaultOption="email-thunderbird" IsRequired="true"
            Description="Would you like to install an email client for university or work email?">
            <TopLine Text="Thunderbird supports Gmail, Outlook, Yahoo and all IMAP/POP3 accounts."/>
            <Options>
                <RadioOption>
                    <Text>Install Thunderbird (recommended)</Text>
                    <Name>email-thunderbird</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Skip — I use webmail in my browser</Text>
                    <Name>email-skip</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <RadioPage DefaultOption="media-vlc" IsRequired="true"
            Description="Would you like to install VLC media player?">
            <TopLine Text="VLC plays all video formats — great for lecture recordings and tutorials."/>
            <Options>
                <RadioOption>
                    <Text>Install VLC Media Player (recommended)</Text>
                    <Name>media-vlc</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Skip — I use another media player</Text>
                    <Name>media-skip</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <RadioPage DefaultOption="enable-defender" IsRequired="true"
            Description="Windows Defender protects your PC from malware and viruses.">
            <TopLine Text="Recommended to keep Defender ON for students and office use."/>
            <Options>
                <RadioOption>
                    <Text>Keep Defender Enabled (Recommended)</Text>
                    <Name>enable-defender</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable Defender (Advanced users only)</Text>
                    <Name>disable-defender</Name>
                </RadioOption>
            </Options>
            <BottomLine Text="You can change this later in Windows Security settings."/>
        </RadioPage>
        <RadioPage DefaultOption="disable-hibernate" IsRequired="true"
            Description="Disabling hibernation frees disk space and prevents system instability.">
            <TopLine Text="This also includes Fast Startup. Recommended for desktops."/>
            <Options>
                <RadioOption>
                    <Text>Disable Hibernate (saves 2-8 GB disk space)</Text>
                    <Name>disable-hibernate</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Keep Hibernate (better for laptops)</Text>
                    <Name>enable-hibernate</Name>
                </RadioOption>
            </Options>
            <BottomLine Text="Warning: Disabling may cause overheating on laptops in sleep mode."/>
        </RadioPage>
        <CheckboxPage IsRequired="true"
            Description="Select which Microsoft components to remove. These improve speed and privacy.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Microsoft Edge</Text>
                    <Name>remove-edge</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove OneDrive (saves 200MB+ disk space)</Text>
                    <Name>remove-onedrive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove AI Features (Copilot and Recall)</Text>
                    <Name>remove-winsxs-ai</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Microsoft Teams (pre-installed version)</Text>
                    <Name>remove-teams</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true"
            Description="Select built-in Windows apps to remove. All can be reinstalled from the Microsoft Store later.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove MS Photos (replaced by better apps)</Text>
                    <Name>remove-appx-photos</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Dev Home</Text>
                    <Name>remove-appx-devhome</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Your Phone / Link to Windows</Text>
                    <Name>remove-appx-yourphone</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Xbox Apps (keep if you game)</Text>
                    <Name>remove-appx-xbox</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true"
            Description="Choose the look and feel of EZE OS after installation.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Apply EZE OS Wallpaper</Text>
                    <Name>configure-wallpaper</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Enable Dark Mode</Text>
                    <Name>configure-darkmode</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Enable Legacy Right-Click Context Menu</Text>
                    <Name>configure-lcm</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Transparency Effects (better performance)</Text>
                    <Name>configure-te</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="Final configuration options.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Clean Up Start Menu Pinned Items</Text>
                    <Name>remove-pinned-items-startmenu</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Automatic Maintenance</Text>
                    <Name>disable-automatic-maintenance</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
