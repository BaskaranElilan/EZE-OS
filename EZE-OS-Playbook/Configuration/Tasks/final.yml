---
title: EZE OS Finalization
description: Applies EZE OS final configurations, wallpaper, and theme
privilege: TrustedInstaller
actions:

  # Optimize NTFS
  - !writeStatus: {status: "Optimizing NTFS"}
  - !cmd:
    command: 'fsutil behavior set disablelastaccess 1'
    ignoreErrors: true
  - !cmd:
    command: 'fsutil behavior set disable8dot3 1'
    ignoreErrors: true

  # Disable Memory Compression
  - !powerShell: 
    command: 'Disable-MMAgent -mc'

  # Disable .NET CLI and PowerShell telemetry
  - !cmd:
    command: 'setx DOTNET_CLI_TELEMETRY_OPTOUT 1'
    runas: currentUserElevated
    
  - !cmd:
    command: 'setx POWERSHELL_TELEMETRY_OPTOUT 1'
    runas: currentUserElevated

  # Disable Office scheduled tasks (telemetry/update tasks)
  - !powerShell: {command: 'Get-ScheduledTask -TaskPath "\Microsoft\Office\*" | Disable-ScheduledTask'}

  # Remove logs
  - !writeStatus: {status: "Removing logs"}
  - !run:
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File CLEANER.ps1'
    weight: 150

  - !writeStatus: {status: "Finalizing EZE OS"}
  - !run: {exeDir: true, exe: "FINALIZE.cmd", weight: 200}

  - !run:
    exeDir: true
    exe: "STARTMENU.cmd"
    option: "remove-pinned-items-startmenu"
    weight: 100

  - !run:
    exeDir: true
    exe: "FILEASSOC.cmd"
    option: "remove-appx-photos"
    weight: 150

  # === EZE OS Wallpaper ===
  - !cmd:
    exeDir: true
    command: 'robocopy "Wallpapers" "%systemroot%\Web\Wallpaper\EZE-OS" /E /PURGE /IM /IT /NP'
    ignoreErrors: true

  - !powerShell:
    command: '.\WALLPAPER.ps1 -Mode Desktop -ImagePath $env:systemroot\Web\Wallpaper\EZE-OS\desktop.jpg'
    exeDir: true
    runas: currentUserElevated
    option: "configure-wallpaper"
    weight: 45

  - !powerShell: 
    command: '.\WALLPAPER.ps1 -Mode LockScreen -ImagePath $env:systemroot\Web\Wallpaper\EZE-OS\lockscreen.jpg'
    exeDir: true
    runas: currentUserElevated
    option: "configure-wallpaper"
    weight: 45

  - !powerShell:
    command: 'Copy-Item -Path .\WALLPAPER.ps1 -Destination "$env:systemroot\Web\Wallpaper\EZE-OS" -Force'
    exeDir: true
    option: "configure-wallpaper"
  
  - !powerShell:
    command: 'Copy-Item -Path .\WallpaperStartup.cmd -Destination "$env:systemroot\Web\Wallpaper\EZE-OS" -Force'
    exeDir: true
    option: "configure-wallpaper"

  # === Themes ===
  - !powerShell:
    command: '.\\Set-Theme.ps1 -Path (Join-Path $env:SystemRoot "Resources\\Themes\\aero.theme")'
    exeDir: true
    runas: currentUserElevated
    option: "!configure-wallpaper"
    options: ["configure-darkmode"]

  - !powerShell:
    command: ".\\Set-Theme.ps1 -New @{ WallpaperPath = (Join-Path $env:SystemRoot 'Web\\Wallpaper\\EZE-OS\\desktop.jpg'); ThemeExportPath = (Join-Path $env:SystemRoot 'Resources\\Themes\\eze-os.theme'); SystemMode = 'Light'; AppMode = 'Light' }"
    exeDir: true
    runas: currentUserElevated
    option: "!configure-darkmode"
    options: ["configure-wallpaper"]

  - !powerShell:
    command: ".\\Set-Theme.ps1 -New @{ WallpaperPath = (Join-Path $env:SystemRoot 'Web\\Wallpaper\\EZE-OS\\desktop.jpg'); ThemeExportPath = (Join-Path $env:SystemRoot 'Resources\\Themes\\eze-os.theme'); SystemMode = 'Dark'; AppMode = 'Dark' }"
    exeDir: true
    runas: currentUserElevated
    option: "configure-darkmode"
    options: ["configure-wallpaper"]

  # Dark / Light mode registry (still needed for Win10)
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '0', option: "configure-darkmode", weight: 70}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '0', option: "configure-darkmode", weight: 50}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '1', option: "!configure-darkmode", weight: 70}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '1', option: "!configure-darkmode", weight: 50}

  # RunOnce for wallpaper on first login
  - !registryValue: 
    path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
    value: 'EZEOSWallpaperStartup'
    type: REG_SZ
    oobe: only
    data: 'cmd /c "%SystemRoot%\Web\Wallpaper\EZE-OS\WallpaperStartup.cmd"'
    option: "configure-wallpaper"

  # Refresh start menu and system cache
  - !appx: {operation: clearCache, name: '*Client.CBS*'}
  - !appx: {operation: clearCache, name: '*StartMenuExperienceHost*', option: "remove-pinned-items-startmenu"}
  - !appx: {operation: clearCache, name: '*Windows.Search*'}
  - !appx: {operation: clearCache, name: '*TCUI*'}

  # Force update group policy
  - !run: 
    exe: "gpupdate.exe"

  # Restart Explorer
  - !powerShell:
    command: |
      $explorerProcess = Get-Process -Name explorer -ErrorAction SilentlyContinue
      if ($explorerProcess) {
        Stop-Process -Name explorer -Force
      }
      Start-Process explorer
    runas: currentUserElevated
