---
title: configure-kernel
description: configure-kernel
privilege: TrustedInstaller
actions:

  # === Enable TSX
  # ------> By default it's disabled due to security reasons; Enabling it makes 4~5 times faster in database transaction and around 40% faster in specific workloads
  # Enable Intel TSX — 4-5x faster in DB transactions, ~40% faster in specific workloads
  # Registry equivalent of: revitool tweaks performance intel-tsx enable
  - !cmd: {command: 'bcdedit /set {current} nx OptIn', ignoreErrors: true}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel', value: 'DisableTsx', type: REG_DWORD, data: '0'}